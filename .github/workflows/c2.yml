

name: Generar IPA c2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-unsigned:
    name: Compilar Safe Manager para iPhone
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear directorio de registros
        run: mkdir -p logs

      - name: Mostrar versiones
        run: |
          {
            echo "===== FECHA ====="
            date
            echo "===== FLUTTER ====="
            flutter --version
            echo "===== DART ====="
            dart --version
            echo "===== XCODE ====="
            xcodebuild -version
            xcodebuild -showsdks
            echo "===== SISTEMA ====="
            sw_vers
          } 2>&1 | tee logs/environment.log

      - name: Obtener dependencias
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee logs/pub-get.log

      - name: Verificar dependencias
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub outdated 2>&1 | tee logs/pub-outdated.log

      - name: Analizar proyecto
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee logs/analyze.log

      - name: Compilar iOS sin firma
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee logs/build-ios.log

      - name: Crear IPA sin firma
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIRECTORY="build/ios/ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No se encontró Runner.app"
            find build/ios -name "*.app" -print || true
            exit 1
          fi

          rm -rf "$IPA_DIRECTORY"
          mkdir -p "$IPA_DIRECTORY/Payload"

          ditto "$APP_PATH" "$IPA_DIRECTORY/Payload/Runner.app"

          cd "$IPA_DIRECTORY"
          zip -qry SafeManager-unsigned.ipa Payload

          test -s SafeManager-unsigned.ipa
          unzip -t SafeManager-unsigned.ipa

          ls -lh SafeManager-unsigned.ipa

      - name: Subir IPA para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SafeManager-iPhone-sin-firma
          path: build/ios/ipa/SafeManager-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Guardar todos los registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeManager-iOS-Logs
          path: logs/
          if-no-files-found: warn
          retention-days: 30
